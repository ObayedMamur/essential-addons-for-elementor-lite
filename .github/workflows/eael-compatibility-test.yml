# Workflow Name: EAEL Compatibility Testing
# This workflow ensures the plugin installs and activates without fatal errors
# across specific legacy and modern WordPress/PHP environments.
name: EAEL Compatibility Testing

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # ← opt into Node 24 now, ahead of June 2026 deadline

jobs:
  compatibility-test:
    runs-on: ubuntu-latest

    strategy:
      # 'fail-fast: false' ensures if one PHP version fails, others continue to run
      fail-fast: false
      matrix:
        # We use an 'include' strategy to match your specific requirements
        include:
          # ── WP / PHP Compatibility Matrix ────────────────────────────────────
          # Requirement 1: WP 6.9.4 across all modern PHP versions (latest Elementor)
          # Elementor latest (>=3.25) requires WP 6.6+, so no version pin needed here.
          - wp-version: "6.9.4"
            php-version: "7.4"
            elementor-version: "latest"
          - wp-version: "6.9.4"
            php-version: "8.0"
            elementor-version: "latest"
          - wp-version: "6.9.4"
            php-version: "8.2"
            elementor-version: "latest"
            conflict-check: true
          - wp-version: "6.9.4"
            php-version: "8.4"
            elementor-version: "latest"

          # Requirement 2: WP 6.5.5 with PHP 8.1
          # Elementor 3.24.3 is the last release that supports WP < 6.6.
          - wp-version: "6.5.5"
            php-version: "8.1"
            elementor-version: "3.24.3"

          # Requirement 3: WP 6.0.9 with PHP 7.4 (Legacy Baseline)
          # Elementor 3.7.8 is compatible with WP 5.6 – 6.2.
          - wp-version: "6.0.9"
            php-version: "7.4"
            elementor-version: "3.7.8"

          # ── Elementor Backward Compatibility Matrix ───────────────────────────
          # Fixed on WP 6.9.4 / PHP 8.1 — only the Elementor major version changes.
          # Ensures EAEL remains functional across the major Elementor release lines.
          - wp-version: "6.9.4"
            php-version: "8.1"
            elementor-version: "3.35.0"   # Latest major – EAEL tested up to 3.35
          - wp-version: "6.9.4"
            php-version: "8.1"
            elementor-version: "3.30.0"   # Elementor 3.30 series
          - wp-version: "6.9.4"
            php-version: "8.1"
            elementor-version: "3.25.0"   # First release requiring WP 6.6+
          - wp-version: "6.9.4"
            php-version: "8.1"
            elementor-version: "3.21.0"   # Pre-WP-6.6-requirement era

    name: "WP ${{ matrix.wp-version }} / PHP ${{ matrix.php-version }} / Elementor ${{ matrix.elementor-version }}"


    steps:
      # 1. Pull the plugin code from the repository
      - name: Checkout EAEL Code
        uses: actions/checkout@v4

      # 2. Setup the specific PHP environment for this matrix job
      - name: Setup PHP Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, mbstring, xml, gd
          tools: wp-cli

      # 3. Start MySQL service (required for WordPress installation)
      - name: Start Database
        run: |
          sudo systemctl start mysql
          mysql -u root -proot -e "CREATE DATABASE wordpress_test;"

      # 4. Download and Install WordPress Core
      - name: Install WordPress Core
        run: |
          wp core download --version=${{ matrix.wp-version }} --path=./test-site --allow-root
          cd test-site
          wp config create --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --allow-root
          wp core install --url=http://localhost:8080 --title="EAEL Test" --admin_user=admin --admin_password=password --admin_email=test@example.com --allow-root

      # 5. Install Elementor (required dependency for EAEL)
      # EAEL's Bootstrap class requires Elementor to be active. Without it,
      # plugin activation will fail with a fatal error.
      # Each matrix entry pins a specific Elementor version compatible with that WP version:
      #   WP 6.9.4 → latest  |  WP 6.5.5 → 3.24.3  |  WP 6.0.9 → 3.7.8
      - name: Install Elementor (Required Dependency)
        run: |
          cd test-site
          ELEMENTOR_VER="${{ matrix.elementor-version }}"
          if [ "$ELEMENTOR_VER" = "latest" ]; then
            wp plugin install elementor --activate --allow-root
          else
            wp plugin install elementor --version="$ELEMENTOR_VER" --activate --allow-root --force
          fi
          echo "✅ Elementor $ELEMENTOR_VER installed and activated"

      # 6. Move Plugin to WP Folder and Attempt Activation
      # We symlink the current directory (the plugin repo) into the WP plugins folder
      # using the correct plugin slug matching the folder/text-domain convention.
      - name: Activate EAEL Plugin
        run: |
          ln -s $(pwd) ./test-site/wp-content/plugins/essential-addons-for-elementor-lite
          cd test-site
          # This command will return an error code if activation triggers a Fatal Error
          wp plugin activate essential-addons-for-elementor-lite --allow-root

      # 7. Basic Integrity Check
      - name: Run Integrity Check
        run: |
          cd test-site
          WP_STATUS=$(wp eval 'echo "Ready";' --quiet --allow-root)
          if [[ "$WP_STATUS" != "Ready" ]]; then
            echo "::error::WordPress environment crashed after activating EAEL."
            exit 1
          fi
          echo "✅ EAEL is active and stable on WP ${{ matrix.wp-version }} / PHP ${{ matrix.php-version }}"

      # 8. Verify Plugin is Listed as Active
      - name: Verify Plugin is Listed as Active
        run: |
          cd test-site
          wp plugin list --status=active --field=name --allow-root | grep -q "essential-addons-for-elementor-lite"
          echo "✅ EAEL is listed as active"

      # 9. Verify Activation Constants & Default Options
      # Checks the real constants and options that EAEL actually defines.
      # Real constants (from essential_adons_elementor.php):
      #   EAEL_PLUGIN_VERSION, EAEL_PLUGIN_PATH, EAEL_PLUGIN_URL,
      #   EAEL_PLUGIN_FILE, EAEL_PLUGIN_BASENAME, EAEL_ASSET_PATH, EAEL_ASSET_URL
      # Real options set (from Migration::migrator() on wp_loaded):
      #   eael_version
      - name: Verify Activation Constants & Options
        run: |
          cd test-site
          wp eval '
            // Trigger wp_loaded so Migration::migrator() runs and saves eael_version
            do_action("wp_loaded");

            // Check critical constants defined in the plugin entry file
            $constants = ["EAEL_PLUGIN_VERSION", "EAEL_PLUGIN_PATH", "EAEL_PLUGIN_URL", "EAEL_ASSET_PATH"];
            foreach ($constants as $c) {
              if (!defined($c)) { echo "::error::Missing constant: $c\n"; exit(1); }
            }
            echo "✅ All constants defined\n";

            // Check eael_version option was saved by the migrator
            $val = get_option("eael_version", "__MISSING__");
            if ($val === "__MISSING__") { echo "::error::Missing option: eael_version\n"; exit(1); }
            echo "✅ eael_version option saved: " . $val . "\n";

            // Version consistency check
            if (get_option("eael_version") !== EAEL_PLUGIN_VERSION) {
              echo "::error::Version mismatch in DB vs constant\n"; exit(1);
            }
            echo "✅ Version stored correctly: " . EAEL_PLUGIN_VERSION . "\n";
          ' --allow-root

      # 10. PHP Syntax Check (All Plugin Files)
      - name: PHP Syntax Check
        run: |
          ERRORS=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error::Syntax error in $file"
              php -l "$file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find ./test-site/wp-content/plugins/essential-addons-for-elementor-lite -name "*.php" -type f)
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS file(s) have syntax errors"
            exit 1
          fi
          echo "✅ All PHP files pass syntax check"

      # 11. Verify Admin Menu Registration
      # In WP-CLI context is_admin()=false, so Bootstrap::register_hooks() never
      # calls add_action('admin_menu', ...). We bypass this by calling the
      # admin_menu() method directly on the already-initialized Bootstrap singleton.
      - name: Verify Admin Menu Registration
        run: |
          cd test-site
          wp eval '
            require_once ABSPATH . "wp-admin/includes/admin.php";

            // Bootstrap is already initialized via plugins_loaded.
            // Directly invoke admin_menu() to register the WP menu entries.
            $instance = \Essential_Addons_Elementor\Classes\Bootstrap::instance();
            $instance->admin_menu();

            global $menu;
            $found = false;
            if (is_array($menu)) {
              foreach ($menu as $item) {
                // EAEL registers the slug "eael-settings"
                if (isset($item[2]) && strpos($item[2], "eael-settings") !== false) {
                  $found = true;
                  echo "✅ Found menu: " . strip_tags($item[0]) . "\n";
                }
              }
            }
            if (!$found) { echo "::error::EAEL admin menu not registered\n"; exit(1); }
          ' --allow-root

      # 12. Check for PHP Warnings & Deprecations Under WP_DEBUG
      - name: Check for PHP Warnings & Deprecations
        run: |
          cd test-site
          wp config set WP_DEBUG true --raw --allow-root
          wp config set WP_DEBUG_LOG true --raw --allow-root

          # Trigger a full WP bootstrap + admin_init cycle
          wp eval 'do_action("admin_init"); echo "Bootstrap OK\n";' --allow-root

          # Check the debug log for warnings/errors
          if [ -f wp-content/debug.log ]; then
            ISSUES=$(grep -cE "(PHP Warning|PHP Fatal|PHP Deprecated|PHP Notice)" wp-content/debug.log || true)
            if [ "$ISSUES" -gt 0 ]; then
              echo "::warning::Found $ISSUES PHP issue(s) in debug.log:"
              grep -E "(PHP Warning|PHP Fatal|PHP Deprecated|PHP Notice)" wp-content/debug.log
              # Fail on Fatal errors, warn on others
              FATALS=$(grep -c "PHP Fatal" wp-content/debug.log || true)
              if [ "$FATALS" -gt 0 ]; then exit 1; fi
            fi
          fi
          echo "✅ No fatal PHP errors under WP_DEBUG"

      # 13. Test Clean Deactivation & Reactivation Cycle
      - name: Test Deactivation and Reactivation Cycle
        run: |
          cd test-site
          wp plugin deactivate essential-addons-for-elementor-lite --allow-root
          echo "✅ Deactivation succeeded"

          # Verify site still works after deactivation
          WP_STATUS=$(wp eval 'echo "Ready";' --quiet --allow-root)
          if [[ "$WP_STATUS" != "Ready" ]]; then
            echo "::error::Site crashed after deactivating EAEL"
            exit 1
          fi
          echo "✅ Site stable after deactivation"

          # Reactivate
          wp plugin activate essential-addons-for-elementor-lite --allow-root
          echo "✅ Reactivation succeeded"

          WP_STATUS=$(wp eval 'echo "Ready";' --quiet --allow-root)
          if [[ "$WP_STATUS" != "Ready" ]]; then
            echo "::error::Site crashed after reactivating EAEL"
            exit 1
          fi
          echo "✅ Site stable after reactivation"

      # 14. Test With Common Plugins (Conflict Check)
      # Verifies EAEL coexists with the most widely-used WordPress plugins.
      # Only runs on one representative modern environment (WP 6.9.4 / PHP 8.2 / Elementor latest)
      # to avoid exhausting CI minutes across all matrix entries.
      - name: Test With Common Plugins (Conflict Check)
        if: matrix.conflict-check
        run: |
          cd test-site

          # Helper: checks WP is alive after a plugin is activated.
          # Uses grep instead of exact match because some plugins (e.g. WooCommerce)
          # print PHP notices to stdout on first activation, polluting the output.
          check_wp_alive() {
            local label="$1"
            WP_STATUS=$(wp eval 'echo "EAEL_OK";' --allow-root 2>/dev/null || true)
            if ! echo "$WP_STATUS" | grep -q "EAEL_OK"; then
              echo "::error::Conflict detected with $label — WordPress failed to boot after activation"
              return 1
            fi
            wp plugin list --status=active --field=name --allow-root | grep -q "essential-addons-for-elementor-lite" \
              && echo "✅ EAEL still active alongside $label"
            echo "✅ No conflicts with $label"
          }

          # Helper: install + activate a plugin gracefully.
          # Captures output to a file (not a pipe) so the exit code is correct.
          try_install_plugin() {
            local slug="$1"
            local label="$2"
            echo "--- Testing $label ---"
            wp plugin install "$slug" --activate --allow-root >/tmp/wp_install.log 2>&1
            local exit_code=$?
            cat /tmp/wp_install.log
            if [ $exit_code -eq 0 ]; then
              check_wp_alive "$label" || return 1
            else
              # If install failed due to a WP version requirement, emit a warning and skip.
              if grep -q "Minimum WordPress requirement" /tmp/wp_install.log \
                || grep -q "could not be found" /tmp/wp_install.log; then
                echo "::warning::Skipping $label conflict check — plugin requires a newer WordPress version than ${{ matrix.wp-version }}"
              else
                echo "::error::Failed to install $label for unexpected reason (see log above)"
                return 1
              fi
            fi
          }

          # ── Akismet (ships with WP by default) ──────────────────────────────
          wp plugin activate akismet --allow-root 2>/dev/null || true
          check_wp_alive "Akismet" || exit 1

          # ── WooCommerce ─────────────────────────────────────────────────────
          # EAEL has dedicated WooCommerce widgets; confirms no fatal on co-activation.
          # Latest WooCommerce requires WP 6.8+ — skipped gracefully on older WP.
          try_install_plugin "woocommerce" "WooCommerce" || exit 1

          # ── Classic Editor ──────────────────────────────────────────────────
          # Ensures the classic editor does not break EAEL's frontend/admin hooks.
          try_install_plugin "classic-editor" "Classic Editor" || exit 1

          # ── Yoast SEO ───────────────────────────────────────────────────────
          # Yoast hooks heavily into wp_head; confirm EAEL does not break it.
          try_install_plugin "wordpress-seo" "Yoast SEO" || exit 1

          # Deactivate third-party plugins after the check to keep env clean
          wp plugin deactivate woocommerce classic-editor wordpress-seo --allow-root 2>/dev/null || true

      # 15. Verify REST API Health
      - name: Verify REST API Health
        run: |
          cd test-site
          wp eval '
            $request  = new WP_REST_Request("GET", "/wp/v2/posts");
            $response = rest_do_request($request);
            if ($response->is_error()) {
              echo "::error::REST API broken after activation: " . $response->as_error()->get_error_message() . "\n";
              exit(1);
            }
            echo "✅ REST API responding normally\n";
          ' --allow-root

      # 16. EAEL Active Without Elementor — No Fatal Errors
      # Confirms that when Elementor is deactivated while EAEL is still active,
      # WordPress continues to boot cleanly (an admin notice is shown — that is
      # intentional and acceptable; a Fatal or PHP Error is NOT acceptable).
      - name: EAEL Active Without Elementor (Graceful Degradation)
        run: |
          cd test-site

          # Deactivate Elementor but leave EAEL active
          wp plugin deactivate elementor --allow-root
          echo "Elementor deactivated, EAEL still active..."

          # Clear any leftover debug log entries from previous steps
          rm -f wp-content/debug.log

          # Trigger a full bootstrap — this is where a fatal would surface
          WP_STATUS=$(wp eval 'echo "Ready";' --quiet --allow-root)
          if [[ "$WP_STATUS" != "Ready" ]]; then
            echo "::error::Fatal Error: WordPress crashed when Elementor is deactivated but EAEL is active."
            exit 1
          fi
          echo "✅ WordPress booted cleanly without Elementor"

          # Ensure no PHP Fatals appeared in the debug log
          if [ -f wp-content/debug.log ]; then
            FATALS=$(grep -c "PHP Fatal" wp-content/debug.log || true)
            if [ "$FATALS" -gt 0 ]; then
              echo "::error::PHP Fatal detected when EAEL is active without Elementor:"
              grep "PHP Fatal" wp-content/debug.log
              exit 1
            fi
          fi
          echo "✅ No PHP Fatal errors when Elementor is deactivated"

          # Verify the expected 'activate Elementor' admin notice IS registered
          # (this is intentional behaviour, not a bug)
          wp eval '
            $notices = [];
            do_action("admin_notices");
            // If we get here without a fatal, graceful degradation is working
            echo "✅ Admin notices fired without fatal\n";
          ' --allow-root

          # Re-activate Elementor for subsequent steps
          wp plugin activate elementor --allow-root
          echo "✅ Elementor re-activated"

      # 17. Frontend Hook Health Check (wp_head / wp_footer)
      # A broken plugin often manifests as a corrupted wp_head or wp_footer.
      # We simulate a frontend request and confirm both hooks execute cleanly.
      - name: Frontend Hook Health Check
        run: |
          cd test-site
          wp eval '
            ob_start();
            do_action("wp_head");
            $head_output = ob_get_clean();
            if (empty($head_output)) {
              echo "::warning::wp_head produced no output — may indicate a hook registration problem\n";
            } else {
              echo "✅ wp_head executed and produced output\n";
            }

            ob_start();
            do_action("wp_footer");
            $footer_output = ob_get_clean();
            // wp_footer can be empty in CLI context; just confirm no fatal
            echo "✅ wp_footer hook executed cleanly\n";
          ' --allow-root

      # 18. EAEL Asset Directory Creation Check
      # On first activation EAEL creates its asset cache directory inside wp-content/uploads.
      # Verifies the directory exists and is writable — a permissions problem here
      # causes silent failures in CSS/JS generation on the front end.
      - name: Asset Directory Writable Check
        run: |
          cd test-site
          wp eval '
            if (!defined("EAEL_ASSET_PATH")) {
              echo "::error::EAEL_ASSET_PATH constant not defined\n";
              exit(1);
            }
            $path = EAEL_ASSET_PATH;
            if (!is_dir($path)) {
              // Try to create it (mirrors what the plugin does at runtime)
              wp_mkdir_p($path);
            }
            if (!is_dir($path)) {
              echo "::error::EAEL asset directory does not exist and could not be created: $path\n";
              exit(1);
            }
            if (!is_writable($path)) {
              echo "::error::EAEL asset directory is not writable: $path\n";
              exit(1);
            }
            echo "✅ EAEL asset directory exists and is writable: $path\n";
          ' --allow-root

      # 19. Shortcode & do_shortcode Safety Check
      # EAEL registers Elementor widgets, but some older EAEL code also touches
      # the shortcode API. Confirm do_shortcode does not fatal on a typical page.
      - name: Shortcode Execution Safety
        run: |
          cd test-site
          wp eval '
            // Create a test post and run do_shortcode on its content
            $post_id = wp_insert_post([
              "post_title"   => "EAEL Shortcode Test",
              "post_content" => "Hello world.",
              "post_status"  => "publish",
              "post_type"    => "post",
            ]);
            if (is_wp_error($post_id)) {
              echo "::error::Could not create test post: " . $post_id->get_error_message() . "\n";
              exit(1);
            }
            $post    = get_post($post_id);
            $content = do_shortcode($post->post_content);
            wp_delete_post($post_id, true);
            echo "✅ do_shortcode executed without fatal errors\n";
          ' --allow-root